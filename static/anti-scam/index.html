<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Khóa học Phòng chống Lừa đảo Trực tuyến cho Thanh thiếu niên</title>
  <meta name="description" content="Trang bị kỹ năng nhận diện và phòng chống các bẫy lừa đảo mạng, MXH, AI Deepfake, tuyển dụng và tài chính trực tuyến dành cho học sinh, sinh viên và thanh thiếu niên.">
  <link rel="stylesheet" href="/anti-scam/anti-scam.css">
  <script src="/anti-scam/anti-scam.js" defer></script>
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="brand">
      <div class="brand-info">
        <h1>Phòng Chống Lừa Đảo Trực Tuyến</h1>
        <p>Cyber Safety & Scam Defense for Teens</p>
      </div>
    </div>
    <div class="header-actions">
      <a href="/projects/anti-scam/" class="btn-home">← Danh mục bài học</a>
      <button id="btn-reset-course" class="btn-reset" title="Đặt lại dữ liệu đánh giá">Đặt lại tiến độ</button>
    </div>
  </header>

  <!-- App Layout -->
  <div class="app-layout" id="app-root">
    <!-- Sidebar / Roadmap -->
    <aside class="sidebar">
      <div class="roadmap-header">
        <h3>Lộ trình khóa học</h3>
        <div class="overall-progress-bar">
          <div id="overall-progress-fill" class="overall-progress-fill"></div>
        </div>
        <div id="overall-progress-text" class="overall-progress-text">Đang tải tiến độ...</div>
      </div>

      <ul id="section-list" class="section-list">
        <!-- Rendered via JS -->
      </ul>
    </aside>

    <!-- Content & Quiz Area -->
    <main class="content-area">
      <!-- View Switcher Tabs -->
      <nav class="view-tabs" aria-label="Chế độ học">
        <button id="tab-lesson" class="tab-btn active">
          <span>Tài liệu bài học</span>
        </button>
        <button id="tab-quiz" class="tab-btn">
          <span>Bài kiểm tra trắc nghiệm</span>
          <span class="tab-badge">20 câu</span>
        </button>
      </nav>

      <!-- Lesson View -->
      <section id="lesson-view" class="lesson-panel"></section>

      <!-- Quiz View -->
      <section id="quiz-view" class="quiz-panel" style="display: none;"></section>
    </main>
  </div>
</body>
</html>
