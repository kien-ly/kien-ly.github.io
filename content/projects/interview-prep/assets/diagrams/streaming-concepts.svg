<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .t { font-size: 13px; fill: #1e293b; }
      .s { font-size: 11.5px; fill: #475569; }
      .h { font-size: 15px; font-weight: 800; fill: #0f172a; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.3; }
      .line { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
      .axis { stroke: #64748b; stroke-width: 1.4; }
      .ev { fill: #2563eb; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="30" y="38" style="font-size:22px;font-weight:800;fill:#0f172a">Stream Processing: Windows, Watermarks, Exactly-Once</text>
  <text x="30" y="60" class="s">The three ideas behind most streaming interview questions.</text>

  <!-- WINDOWS -->
  <rect x="20" y="78" width="1160" height="250" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="106" class="h">1 · Window types (event time →)</text>

  <!-- events axis -->
  <line x1="200" y1="135" x2="1150" y2="135" class="axis"/>
  <g class="ev">
    <circle cx="230" cy="135" r="5"/><circle cx="262" cy="135" r="5"/><circle cx="300" cy="135" r="5"/>
    <circle cx="420" cy="135" r="5"/><circle cx="455" cy="135" r="5"/>
    <circle cx="640" cy="135" r="5"/><circle cx="665" cy="135" r="5"/><circle cx="700" cy="135" r="5"/><circle cx="730" cy="135" r="5"/>
    <circle cx="960" cy="135" r="5"/><circle cx="1000" cy="135" r="5"/>
  </g>
  <text x="40" y="140" class="t">events (one key)</text>

  <text x="40" y="180" class="t" style="font-weight:700">Tumbling</text>
  <text x="40" y="196" class="s">fixed, no overlap</text>
  <rect x="200" y="166" width="236" height="26" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <rect x="438" y="166" width="236" height="26" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <rect x="676" y="166" width="236" height="26" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <rect x="914" y="166" width="236" height="26" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="290" y="184" class="s">00:00–00:05 → 3</text><text x="528" y="184" class="s">00:05–00:10 → 2</text>
  <text x="766" y="184" class="s">00:10–00:15 → 4</text><text x="1004" y="184" class="s">00:15–00:20 → 2</text>

  <text x="40" y="232" class="t" style="font-weight:700">Sliding / hopping</text>
  <text x="40" y="248" class="s">size 10m, slide 5m</text>
  <rect x="200" y="214" width="474" height="20" rx="4" fill="#dcfce7" stroke="#22c55e"/>
  <rect x="438" y="238" width="474" height="20" rx="4" fill="#dcfce7" stroke="#22c55e"/>
  <rect x="676" y="262" width="474" height="20" rx="4" fill="#dcfce7" stroke="#22c55e"/>
  <text x="210" y="228" class="s">00:00–00:10 → 5</text><text x="448" y="252" class="s">00:05–00:15 → 6 (events in 2 windows)</text><text x="686" y="276" class="s">00:10–00:20 → 6</text>

  <text x="40" y="306" class="t" style="font-weight:700">Session</text>
  <text x="40" y="322" class="s">gap = 2 min of inactivity</text>
  <rect x="222" y="292" width="88" height="24" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <rect x="412" y="292" width="52" height="24" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <rect x="632" y="292" width="106" height="24" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <rect x="952" y="292" width="56" height="24" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="320" y="309" class="s">gap &gt; 2m</text><text x="480" y="309" class="s">← dynamic length, per key →</text>
  <text x="790" y="309" class="s">close on gap</text>

  <!-- WATERMARK -->
  <rect x="20" y="345" width="560" height="395" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="373" class="h">2 · Event time vs processing time + watermark</text>
  <line x1="80" y1="690" x2="545" y2="690" class="axis" marker-end="url(#arr)"/>
  <line x1="80" y1="690" x2="80" y2="400" class="axis" marker-end="url(#arr)"/>
  <text x="400" y="712" class="s">processing time (arrival) →</text>
  <text x="56" y="545" class="s" text-anchor="middle" transform="rotate(-90 56 545)">event time (when it happened) →</text>
  <line x1="80" y1="690" x2="380" y2="400" stroke="#cbd5e1" stroke-dasharray="4 4"/>
  <text x="290" y="470" class="s" transform="rotate(-44 300 470)">ideal: zero delay</text>
  <line x1="150" y1="690" x2="490" y2="410" stroke="#ea580c" stroke-width="2.2"/>
  <text x="430" y="438" class="t" style="fill:#c2410c;font-weight:700">watermark</text>
  <text x="430" y="454" class="s" style="fill:#c2410c">= max event time − 10 min</text>
  <g class="ev">
    <circle cx="140" cy="640" r="5"/><circle cx="175" cy="620" r="5"/><circle cx="215" cy="590" r="5"/>
    <circle cx="250" cy="575" r="5"/><circle cx="300" cy="520" r="5"/><circle cx="335" cy="505" r="5"/>
    <circle cx="370" cy="470" r="5"/>
  </g>
  <circle cx="275" cy="548" r="6" fill="#16a34a"/>
  <line x1="200" y1="512" x2="270" y2="544" stroke="#16a34a" stroke-width="1"/>
  <text x="100" y="496" class="s" style="fill:#15803d">late, but above watermark</text>
  <text x="100" y="510" class="s" style="fill:#15803d">→ still counted</text>
  <circle cx="420" cy="560" r="6" fill="#dc2626"/>
  <text x="390" y="590" class="s" style="fill:#b91c1c">too late (below watermark)</text>
  <text x="390" y="605" class="s" style="fill:#b91c1c">→ dropped or side-output / DLQ</text>
  <text x="100" y="430" class="s">Watermark trade-off:</text>
  <text x="100" y="446" class="s">bigger delay = more complete,</text>
  <text x="100" y="462" class="s">but higher latency + more state</text>

  <!-- EXACTLY ONCE -->
  <rect x="600" y="345" width="580" height="395" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="620" y="373" class="h">3 · Exactly-once = 3 ingredients</text>

  <rect x="620" y="395" width="160" height="96" rx="10" class="box" style="stroke:#0891b2;stroke-width:2"/>
  <text x="634" y="419" class="t" style="font-weight:700">Replayable source</text>
  <text x="634" y="439" class="s">Kafka offsets, Delta</text>
  <text x="634" y="455" class="s">versions, files;</text>
  <text x="634" y="471" class="s">can re-read from X</text>

  <rect x="800" y="395" width="170" height="96" rx="10" class="box" style="stroke:#16a34a;stroke-width:2"/>
  <text x="814" y="419" class="t" style="font-weight:700">Checkpointed engine</text>
  <text x="814" y="439" class="s">offsets + operator state</text>
  <text x="814" y="455" class="s">saved atomically per</text>
  <text x="814" y="471" class="s">micro-batch / barrier</text>

  <rect x="990" y="395" width="170" height="96" rx="10" class="box" style="stroke:#7c3aed;stroke-width:2"/>
  <text x="1004" y="419" class="t" style="font-weight:700">Idempotent or</text>
  <text x="1004" y="435" class="t" style="font-weight:700">transactional sink</text>
  <text x="1004" y="455" class="s">MERGE on key, txn ids,</text>
  <text x="1004" y="471" class="s">Kafka transactions, 2PC</text>
  <path d="M780,443 L798,443" class="line"/>
  <path d="M970,443 L988,443" class="line"/>

  <text x="620" y="525" class="t" style="font-weight:700">Crash story (micro-batch 42):</text>
  <rect x="620" y="538" width="540" height="30" rx="6" fill="#eff6ff"/>
  <text x="632" y="558" class="s">① read offsets 1000–1999  ② compute  ③ write sink  ④ commit checkpoint "batch 42 done"</text>
  <rect x="620" y="574" width="540" height="30" rx="6" fill="#fef2f2"/>
  <text x="632" y="594" class="s">💥 crash between ③ and ④ → restart sees batch 42 not committed → re-runs it</text>
  <rect x="620" y="610" width="540" height="30" rx="6" fill="#f0fdf4"/>
  <text x="632" y="630" class="s">Sink must tolerate the replay: Delta records (txnAppId, batchId) and skips a batch it already wrote</text>

  <text x="620" y="668" class="t" style="font-weight:700">Remember:</text>
  <text x="620" y="688" class="s">at-least-once delivery + idempotent processing = effectively exactly-once results.</text>
  <text x="620" y="706" class="s">Side effects (emails, API calls) are NOT covered: dedupe them with an idempotency key.</text>
  <text x="620" y="724" class="s">Exactly-once is end-to-end: one at-least-once hop breaks the guarantee.</text>
</svg>
